<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🃏 TCG Business Idea Generator</title>
<style>
  :root {
    --bg: #0b0e14;
    --panel: #131722;
    --panel-2: #1b2030;
    --border: #2a3142;
    --text: #d6dae3;
    --muted: #8b93a7;
    --accent: #5b8def;
    --accent-2: #38d39f;
    --gold: #e0b341;
    --danger: #e0556b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: radial-gradient(1200px 600px at 50% -10%, #16203a 0%, var(--bg) 60%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    line-height: 1.5;
  }
  .wrap { max-width: 820px; margin: 0 auto; padding: 40px 20px 80px; }
  header { text-align: center; margin-bottom: 32px; }
  h1 { font-size: 1.9rem; margin: 0 0 6px; letter-spacing: -0.02em; }
  header p { color: var(--muted); margin: 0; }
  .card {
    background: linear-gradient(180deg, var(--panel) 0%, #0f131d 100%);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 26px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.35);
  }
  .progress { display: flex; gap: 6px; margin-bottom: 22px; }
  .progress .dot { flex: 1; height: 4px; border-radius: 4px; background: var(--panel-2); transition: background .25s; }
  .progress .dot.done { background: var(--accent); }
  .progress .dot.active { background: var(--accent-2); }
  .q-kicker { font-size: .72rem; letter-spacing: .15em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .q-title { font-size: 1.35rem; margin: 0 0 4px; }
  .q-sub { color: var(--muted); margin: 0 0 22px; font-size: .95rem; }
  .options { display: grid; gap: 10px; }
  .opt {
    text-align: left; width: 100%; cursor: pointer;
    background: var(--panel-2); border: 1px solid var(--border);
    color: var(--text); padding: 14px 16px; border-radius: 10px;
    font-size: 1rem; transition: border-color .15s, transform .05s, background .15s;
    display: flex; align-items: center; gap: 12px;
  }
  .opt:hover { border-color: var(--accent); background: #20273a; }
  .opt:active { transform: scale(.995); }
  .opt.selected { border-color: var(--accent-2); background: #182a26; }
  .opt .emoji { font-size: 1.25rem; }
  .opt .label { font-weight: 600; }
  .opt .desc { color: var(--muted); font-size: .85rem; font-weight: 400; }
  .opt .col { display: flex; flex-direction: column; }
  .multi-hint { font-size: .8rem; color: var(--gold); margin: 14px 0 0; font-family: ui-monospace, monospace; }
  .nav { display: flex; justify-content: space-between; margin-top: 24px; gap: 12px; }
  button.btn {
    background: var(--accent); color: #fff; border: none; padding: 11px 22px;
    border-radius: 9px; font-size: 1rem; font-weight: 600; cursor: pointer;
  }
  button.btn:hover { filter: brightness(1.08); }
  button.btn.ghost { background: transparent; border: 1px solid var(--border); color: var(--muted); }
  button.btn:disabled { opacity: .4; cursor: not-allowed; }

  /* Results */
  .result-head { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-bottom: 4px; }
  .result-head h2 { margin: 0; font-size: 1.5rem; }
  .pill { font-family: ui-monospace, monospace; font-size: .72rem; padding: 3px 9px; border-radius: 20px; border: 1px solid var(--border); color: var(--muted); }
  .seed {
    border: 1px solid var(--border); border-radius: 11px; padding: 16px 18px; margin: 14px 0;
    background: var(--panel-2);
  }
  .seed h3 { margin: 0 0 4px; font-size: 1.08rem; }
  .seed .meta { font-family: ui-monospace, monospace; font-size: .75rem; color: var(--gold); margin-bottom: 8px; }
  .seed p { margin: 0; color: var(--text); font-size: .94rem; }
  .seed .why { color: var(--muted); font-size: .85rem; margin-top: 8px; }
  .promptbox {
    background: #070a10; border: 1px solid var(--border); border-radius: 11px;
    padding: 16px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: .82rem; white-space: pre-wrap; color: #c7d0e0; max-height: 340px; overflow: auto;
    line-height: 1.55;
  }
  .section-label { font-size: .72rem; letter-spacing: .15em; text-transform: uppercase; color: var(--muted); margin: 26px 0 10px; font-family: ui-monospace, monospace; }
  .copybar { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
  .copied { color: var(--accent-2); font-size: .85rem; align-self: center; }
  .savebox {
    margin-top: 28px; border: 1px solid var(--border); border-radius: 12px;
    padding: 18px 20px; background: rgba(56,211,159,.05);
  }
  .savebox h3 { margin: 0 0 4px; font-size: 1.05rem; }
  .savebox p { margin: 0 0 14px; color: var(--muted); font-size: .9rem; }
  .savebox input {
    width: 100%; background: #070a10; border: 1px solid var(--border); border-radius: 9px;
    color: var(--text); padding: 11px 14px; font-size: 1rem; margin-bottom: 12px;
  }
  .savebox input:focus { outline: none; border-color: var(--accent); }
  .savemsg { font-size: .9rem; align-self: center; }
  .savemsg.ok { color: var(--accent-2); }
  .savemsg.err { color: var(--danger); }
  footer { text-align: center; color: var(--muted); font-size: .82rem; margin-top: 30px; }
  a { color: var(--accent); }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🃏 TCG Business Idea Generator</h1>
    <p>Answer a few questions. Get matched idea seeds + a tailored prompt for Claude/ChatGPT.</p>
  </header>

  <div class="card">
    <div class="progress" id="progress"></div>
    <div id="quiz"></div>
    <div id="results" class="hidden"></div>
  </div>

  <footer>
    <span id="privacyNote"></span> Built off the <strong>Mana Vault</strong> project &mdash; see
    <code>IDEAS.md</code> next to this file for the full write-up.
  </footer>
</div>

<script>
// ---- Response logging (optional) ----
// Paste your deployed Google Apps Script Web App URL (…/exec) between the quotes to
// turn on logging. While this is empty, nothing is sent and the form stays fully local.
const LOG_ENDPOINT = "https://script.google.com/macros/s/AKfycbxlA5nYxAu9Ow6KDFbyd5cJmltclQq6hRQUmICHHc_O-koAJRDMn_zJ2NtH5J6CW22H/exec";

function logSubmission(payload) {
  if (!LOG_ENDPOINT) return Promise.resolve({ skipped: true });
  // text/plain keeps this a CORS "simple request" (no preflight); no-cors = fire-and-forget.
  return fetch(LOG_ENDPOINT, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload),
  });
}

// ---- Interview definition ----
const QUESTIONS = [
  {
    id: "capital",
    kicker: "Question 1 / 6",
    title: "How much money can you put in?",
    sub: "Be honest — it changes everything about what's realistic.",
    options: [
      { v: "none",  emoji: "💻", label: "Basically nothing", desc: "A laptop and my time" },
      { v: "small", emoji: "💵", label: "A few hundred to a few thousand", desc: "Bootstrap, no investors" },
      { v: "real",  emoji: "💰", label: "Real capital", desc: "$10k+ or able to raise it" },
    ]
  },
  {
    id: "skill",
    kicker: "Question 2 / 6",
    title: "What's your strongest skill?",
    sub: "What you'd reach for first if you had to build something this weekend.",
    options: [
      { v: "build",   emoji: "🛠️", label: "Building software", desc: "Code, data, ML" },
      { v: "content", emoji: "🎥", label: "Content & audience", desc: "Writing, video, community" },
      { v: "sales",   emoji: "🤝", label: "Sales & operations", desc: "Sourcing, deals, logistics" },
      { v: "domain",  emoji: "🎴", label: "Deep game knowledge", desc: "I just really know the game" },
    ]
  },
  {
    id: "time",
    kicker: "Question 3 / 6",
    title: "How much time can you give it?",
    sub: "",
    options: [
      { v: "side",  emoji: "🌙", label: "Nights & weekends", desc: "Side project for now" },
      { v: "part",  emoji: "⏰", label: "Serious part-time", desc: "20+ hrs/week" },
      { v: "full",  emoji: "🚀", label: "All in", desc: "This is the job" },
    ]
  },
  {
    id: "risk",
    kicker: "Question 4 / 6",
    title: "What's your risk appetite?",
    sub: "",
    options: [
      { v: "safe",   emoji: "🛡️", label: "Steady & low-risk", desc: "Predictable, slow is fine" },
      { v: "bal",    emoji: "⚖️", label: "Balanced", desc: "Some risk for more upside" },
      { v: "swing",  emoji: "🎲", label: "Swing for the fences", desc: "Big upside or bust" },
    ]
  },
  {
    id: "interest",
    kicker: "Question 5 / 6 · pick any that fit",
    title: "What actually excites you?",
    sub: "",
    multi: true,
    options: [
      { v: "data",    emoji: "📈", label: "Data & analytics", desc: "Prices, trends, the 'cards as stocks' angle" },
      { v: "ai",      emoji: "🤖", label: "AI / ML", desc: "Scanning, prediction, coaching" },
      { v: "physical",emoji: "📦", label: "Physical product", desc: "Reselling, boxes, inventory" },
      { v: "media",   emoji: "📣", label: "Audience & media", desc: "Newsletter, streams, community" },
      { v: "b2b",     emoji: "🏬", label: "Serving stores/orgs", desc: "B2B tools, infrastructure" },
    ]
  },
  {
    id: "game",
    kicker: "Question 6 / 6",
    title: "Which world do you know best?",
    sub: "Niching down beats going broad early.",
    options: [
      { v: "mtg",     emoji: "🌋", label: "Magic: The Gathering", desc: "Deep, finance-brained player base" },
      { v: "pokemon", emoji: "⚡", label: "Pokémon", desc: "Huge, mainstream, collector-heavy" },
      { v: "sports",  emoji: "🏈", label: "Sports cards", desc: "Grading & breaks culture" },
      { v: "other",   emoji: "🃏", label: "Something else / all of it", desc: "Lorcana, Yu-Gi-Oh!, One Piece…" },
    ]
  },
];

// ---- Idea seed catalog (mirrors IDEAS.md) ----
const SEEDS = [
  { id:"tracker", title:"Collection-as-portfolio tracker", cat:"Software · 🟢", pitch:"“Robinhood for your binder.” Import a collection, value it daily, show P&L, gainers/losers, allocation by set & rarity.", tags:{skill:["build"], interest:["data"], capital:["none","small"]} },
  { id:"alerts", title:"Price-alert & watchlist service", cat:"Software · 🟢", pitch:"“Tell me when [card] crosses $X.” Low-capital first product; natural paid upsell on a free tracker.", tags:{skill:["build"], interest:["data"], capital:["none","small"]} },
  { id:"arb", title:"Cross-vendor arbitrage scanner", cat:"Software · 🟡", pitch:"Surface price gaps between TCGPlayer / CardKingdom / eBay big enough to flip after fees & shipping.", tags:{skill:["build"], interest:["data"], capital:["none","small"], risk:["bal","swing"]} },
  { id:"deck", title:"Deck-value & metagame cost tools", cat:"Software · 🟢", pitch:"Paste a decklist → total cost, cheapest vendor, budget swaps, price trend. Strong affiliate angle.", tags:{skill:["build","domain"], interest:["data"], capital:["none","small"]} },
  { id:"store", title:"Local game store back-office SaaS", cat:"Software · 🔴", pitch:"Inventory, buylist pricing, event registration & POS for stores still living in spreadsheets.", tags:{skill:["build","sales"], interest:["b2b"], capital:["real"], time:["full"]} },
  { id:"scanner", title:"Phone card-scanner + condition grading", cat:"AI/ML · 🟡", pitch:"Point your phone at a card → instant ID, printing, value, and a condition estimate. The grading part is the moat.", tags:{skill:["build"], interest:["ai"], capital:["small","real"]} },
  { id:"coach", title:"AI deck-builder / coach", cat:"AI/ML · 🟢", pitch:"“Build me a budget Commander deck” / “improve this vs the meta.” LLM + card DB + metagame data.", tags:{skill:["build","domain"], interest:["ai"], capital:["none","small"]} },
  { id:"predict", title:"Price-prediction “card analyst”", cat:"AI/ML · 🟡", pitch:"Forecast which cards rise — reprint risk, tournament results, hype. Great content even when the model is so-so.", tags:{skill:["build","content"], interest:["ai","data"], risk:["swing"]} },
  { id:"api", title:"Clean price-data API / aggregator", cat:"Infra · 🔴", pitch:"Be the reliable data source every other tool pays for. Hardest to build, most defensible if you nail it.", tags:{skill:["build"], interest:["b2b","data"], capital:["small","real"], time:["full"]} },
  { id:"news", title:"“Card finance” newsletter / content brand", cat:"Content · 🟢", pitch:"Daily/weekly movers, reprint watch, deals. Lowest capital of anything; compounds with every tool you add.", tags:{skill:["content","domain"], interest:["media","data"], capital:["none"]} },
  { id:"events", title:"Tournament & event platform", cat:"Content · 🔴", pitch:"Registration, pairings, results & metagame tracking for local + online events.", tags:{skill:["build","sales"], interest:["b2b","media"], capital:["real"]} },
  { id:"reseller", title:"Niche reseller / flipping operation", cat:"Retail · 🟡", pitch:"Buy underpriced, sell at market — specialize hard (one game, era, language, sealed). Data tools give you the edge.", tags:{skill:["sales","domain"], interest:["physical"], capital:["small","real"], risk:["bal","swing"]} },
  { id:"breaks", title:"Sealed product / live “case breaks”", cat:"Retail · 🔴", pitch:"Open packs on stream, viewers buy slots. A media business wearing a card-business hat.", tags:{skill:["content","sales"], interest:["physical","media"], capital:["real"], risk:["swing"]} },
  { id:"box", title:"Curated subscription box", cat:"Retail · 🟡", pitch:"Monthly singles/accessories for a niche — “Commander upgrades,” “new-player on-ramp,” “vintage Pokémon.”", tags:{skill:["sales","domain"], interest:["physical"], capital:["small","real"]} },
  { id:"escrow", title:"Authentication / escrow for high-value cards", cat:"Retail · 🔴", pitch:"Trusted middleman for expensive trades — verify authenticity, hold funds, ship safely. Counterfeits are a real, growing problem.", tags:{skill:["sales"], interest:["physical","b2b"], capital:["real"], risk:["bal"]} },
];

// ---- State ----
const answers = {};
let step = 0;

const quizEl = document.getElementById("quiz");
const resultsEl = document.getElementById("results");
const progressEl = document.getElementById("progress");

function renderProgress() {
  progressEl.innerHTML = "";
  for (let i = 0; i < QUESTIONS.length; i++) {
    const d = document.createElement("div");
    d.className = "dot" + (i < step ? " done" : i === step && step < QUESTIONS.length ? " active" : "");
    progressEl.appendChild(d);
  }
}

function renderQuestion() {
  renderProgress();
  const q = QUESTIONS[step];
  const sel = answers[q.id] || (q.multi ? [] : null);
  quizEl.innerHTML = `
    <div class="q-kicker">${q.kicker}</div>
    <h2 class="q-title">${q.title}</h2>
    ${q.sub ? `<p class="q-sub">${q.sub}</p>` : `<div style="height:14px"></div>`}
    <div class="options" id="opts"></div>
    ${q.multi ? `<p class="multi-hint">▸ pick as many as apply</p>` : ``}
    <div class="nav">
      <button class="btn ghost" id="back" ${step === 0 ? "disabled" : ""}>← Back</button>
      <button class="btn" id="next" ${isAnswered(q, sel) ? "" : "disabled"}>${step === QUESTIONS.length - 1 ? "See my ideas →" : "Next →"}</button>
    </div>
  `;
  const optsEl = document.getElementById("opts");
  q.options.forEach(o => {
    const isSel = q.multi ? sel.includes(o.v) : sel === o.v;
    const b = document.createElement("button");
    b.className = "opt" + (isSel ? " selected" : "");
    b.innerHTML = `<span class="emoji">${o.emoji}</span><span class="col"><span class="label">${o.label}</span>${o.desc ? `<span class="desc">${o.desc}</span>` : ""}</span>`;
    b.onclick = () => {
      if (q.multi) {
        const cur = answers[q.id] || [];
        answers[q.id] = cur.includes(o.v) ? cur.filter(x => x !== o.v) : [...cur, o.v];
      } else {
        answers[q.id] = o.v;
      }
      renderQuestion();
    };
    optsEl.appendChild(b);
  });
  document.getElementById("back").onclick = () => { if (step > 0) { step--; renderQuestion(); } };
  const nb = document.getElementById("next");
  nb.onclick = () => {
    if (!isAnswered(q, answers[q.id] || (q.multi ? [] : null))) return;
    if (step === QUESTIONS.length - 1) { showResults(); }
    else { step++; renderQuestion(); }
  };
}

function isAnswered(q, sel) {
  return q.multi ? (sel && sel.length > 0) : !!sel;
}

// ---- Scoring ----
function scoreSeeds() {
  const a = answers;
  return SEEDS.map(s => {
    let score = 0;
    const t = s.tags;
    if (t.skill && t.skill.includes(a.skill)) score += 3;
    if (t.capital && t.capital.includes(a.capital)) score += 2;
    if (t.risk && t.risk.includes(a.risk)) score += 1;
    if (t.time && t.time.includes(a.time)) score += 1;
    if (t.interest && a.interest) {
      const overlap = t.interest.filter(x => a.interest.includes(x)).length;
      score += overlap * 2;
    }
    // gentle penalty: big-capital ideas when they have none
    if (t.capital && t.capital.length && !t.capital.includes("none") && !t.capital.includes("small") && a.capital === "none") score -= 3;
    return { ...s, score };
  }).sort((x, y) => y.score - x.score);
}

const LABELS = {
  capital: { none:"basically no capital", small:"a few hundred to a few thousand dollars", real:"real capital ($10k+)" },
  skill:   { build:"building software (code/data/ML)", content:"content & audience-building", sales:"sales & operations", domain:"deep game knowledge" },
  time:    { side:"nights & weekends", part:"serious part-time (20+ hrs/wk)", full:"full-time, all in" },
  risk:    { safe:"low-risk and steady", bal:"a balanced risk appetite", swing:"a swing-for-the-fences appetite" },
  game:    { mtg:"Magic: The Gathering", pokemon:"Pokémon", sports:"sports cards", other:"trading cards broadly (Lorcana / Yu-Gi-Oh! / One Piece / etc.)" },
};
const INTEREST_LABELS = { data:"data & analytics", ai:"AI/ML", physical:"physical product", media:"audience & media", b2b:"serving stores/orgs" };

function buildPrompt(top3) {
  const a = answers;
  const interests = (a.interest || []).map(i => INTEREST_LABELS[i]).join(", ");
  return `You are a sharp startup advisor who knows the trading-card-game (TCG) industry well.
Help me develop a TCG business I could actually start. Here's my situation:

- Capital available: ${LABELS.capital[a.capital]}
- Strongest skill: ${LABELS.skill[a.skill]}
- Time I can commit: ${LABELS.time[a.time]}
- Risk appetite: ${LABELS.risk[a.risk]}
- What excites me: ${interests}
- The game/world I know best: ${LABELS.game[a.game]}

Based on this, three directions already look promising to me:
1. ${top3[0].title} — ${top3[0].pitch}
2. ${top3[1].title} — ${top3[1].pitch}
3. ${top3[2].title} — ${top3[2].pitch}

Please:
1. Pressure-test these three for someone with my exact constraints — which is the best FIRST move and why?
2. Sharpen the winner into a concrete 30-day plan: the smallest thing I can ship, who my first 10 customers are, and how I'd reach them.
3. Tell me the single biggest risk or reason it might fail, and how I'd find out cheaply before sinking time in.
4. Suggest one non-obvious angle or niche I probably haven't considered.

Be specific and honest. Push back if my self-assessment seems off. Ask me up to 3 clarifying questions first if it would meaningfully sharpen your advice.`;
}

function showResults() {
  renderProgress();
  quizEl.classList.add("hidden");
  resultsEl.classList.remove("hidden");
  const ranked = scoreSeeds();
  const top = ranked.slice(0, 3);
  const prompt = buildPrompt(top);

  // Readable record sent to the optional Google Sheet log.
  const a = answers;
  const record = {
    name: "",
    capital: LABELS.capital[a.capital] || "",
    skill: LABELS.skill[a.skill] || "",
    time: LABELS.time[a.time] || "",
    risk: LABELS.risk[a.risk] || "",
    interests: (a.interest || []).map(i => INTEREST_LABELS[i]),
    game: LABELS.game[a.game] || "",
    top1: top[0] ? top[0].title : "",
    top2: top[1] ? top[1].title : "",
    top3: top[2] ? top[2].title : "",
    prompt: prompt,
    userAgent: navigator.userAgent,
    page: location.href,
  };

  const saveSection = LOG_ENDPOINT ? `
    <div class="savebox">
      <h3>📨 Send your answers back?</h3>
      <p>Optional — share your responses so we can follow up with more tailored help. Nothing is sent unless you click save.</p>
      <input id="saveName" type="text" placeholder="First name (optional)" autocomplete="given-name">
      <div class="copybar">
        <button class="btn" id="saveBtn">💾 Save my responses</button>
        <span class="savemsg" id="saveMsg"></span>
      </div>
    </div>` : "";

  resultsEl.innerHTML = `
    <div class="result-head">
      <h2>🎯 Your top matches</h2>
      <span class="pill">${LABELS.game[answers.game]}</span>
    </div>
    <p class="q-sub">Ranked from the idea catalog against your answers. 🟢 easy start · 🟡 real commitment · 🔴 needs money/team.</p>
    <div id="seeds"></div>

    <div class="section-label">Your tailored prompt — paste into Claude or ChatGPT</div>
    <div class="promptbox" id="promptbox">${escapeHtml(prompt)}</div>
    <div class="copybar">
      <button class="btn" id="copyBtn">📋 Copy prompt</button>
      <button class="btn ghost" id="restartBtn">↻ Start over</button>
      <span class="copied hidden" id="copiedMsg">Copied ✓</span>
    </div>
    ${saveSection}
  `;

  const seedsEl = document.getElementById("seeds");
  top.forEach((s, i) => {
    const div = document.createElement("div");
    div.className = "seed";
    div.innerHTML = `<h3>${i + 1}. ${s.title}</h3><div class="meta">${s.cat}</div><p>${s.pitch}</p>`;
    seedsEl.appendChild(div);
  });
  // a couple of "also consider" runners-up
  const more = ranked.slice(3, 5);
  if (more.length) {
    const lbl = document.createElement("div");
    lbl.className = "section-label";
    lbl.textContent = "Also worth a look";
    seedsEl.appendChild(lbl);
    more.forEach(s => {
      const div = document.createElement("div");
      div.className = "seed";
      div.style.opacity = ".82";
      div.innerHTML = `<h3>${s.title}</h3><div class="meta">${s.cat}</div><p>${s.pitch}</p>`;
      seedsEl.appendChild(div);
    });
  }

  document.getElementById("copyBtn").onclick = () => {
    navigator.clipboard.writeText(prompt).then(() => {
      const m = document.getElementById("copiedMsg");
      m.classList.remove("hidden");
      setTimeout(() => m.classList.add("hidden"), 2000);
    });
  };
  document.getElementById("restartBtn").onclick = () => {
    step = 0;
    for (const k in answers) delete answers[k];
    resultsEl.classList.add("hidden");
    quizEl.classList.remove("hidden");
    renderQuestion();
  };

  const saveBtn = document.getElementById("saveBtn");
  if (saveBtn) {
    saveBtn.onclick = () => {
      const msg = document.getElementById("saveMsg");
      const nameEl = document.getElementById("saveName");
      record.name = nameEl ? nameEl.value.trim() : "";
      saveBtn.disabled = true;
      msg.className = "savemsg";
      msg.textContent = "Saving…";
      logSubmission(record)
        .then(() => {
          msg.className = "savemsg ok";
          msg.textContent = "Saved — thanks! ✓";
          saveBtn.textContent = "✓ Saved";
          if (nameEl) nameEl.disabled = true;
        })
        .catch(() => {
          msg.className = "savemsg err";
          msg.textContent = "Couldn't save — check your connection and retry.";
          saveBtn.disabled = false;
        });
    };
  }
}

function escapeHtml(s) {
  return s.replace(/[&<>]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;" }[c]));
}

document.getElementById("privacyNote").textContent = LOG_ENDPOINT
  ? "Your answers stay in your browser unless you choose to save them at the end, in which case they're shared with the site owner to help you."
  : "No data leaves your browser.";

renderQuestion();
</script>
</body>
</html>
