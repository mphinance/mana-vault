<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🃏 TCG Business Ideas — Brief</title>
<style>
  :root {
    --bg: #0b0e14; --panel: #131722; --panel-2: #1b2030; --border: #2a3142;
    --text: #d6dae3; --muted: #8b93a7; --accent: #5b8def; --accent-2: #38d39f; --gold: #e0b341;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: radial-gradient(1200px 600px at 50% -10%, #16203a 0%, var(--bg) 60%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.65;
  }
  .wrap { max-width: 820px; margin: 0 auto; padding: 30px 22px 90px; }
  .topbar { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
  .topbar a { color: var(--accent); text-decoration: none; font-size: .9rem; font-family: ui-monospace, monospace; }
  .topbar a:hover { text-decoration: underline; }
  .doc {
    background: linear-gradient(180deg, var(--panel) 0%, #0f131d 100%);
    border: 1px solid var(--border); border-radius: 14px; padding: 14px 38px 40px;
    box-shadow: 0 10px 40px rgba(0,0,0,.35);
  }
  .doc h1 { font-size: 2rem; letter-spacing: -.02em; border-bottom: 1px solid var(--border); padding-bottom: 14px; }
  .doc h2 { font-size: 1.45rem; margin-top: 38px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
  .doc h3 { font-size: 1.12rem; margin-top: 26px; color: var(--accent-2); }
  .doc a { color: var(--accent); }
  .doc code { background: var(--panel-2); padding: 2px 6px; border-radius: 5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .88em; }
  .doc hr { border: none; border-top: 1px solid var(--border); margin: 34px 0; }
  .doc blockquote {
    margin: 18px 0; padding: 4px 18px; border-left: 3px solid var(--gold);
    background: rgba(224,179,65,.06); color: var(--muted); border-radius: 0 8px 8px 0;
  }
  .doc blockquote strong { color: var(--gold); }
  .doc ol, .doc ul { padding-left: 24px; }
  .doc li { margin: 6px 0; }
  .doc strong { color: #eef1f6; }
  .loading { color: var(--muted); text-align: center; padding: 60px 0; font-family: ui-monospace, monospace; }
  .err { color: #e0556b; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a href="index.html">← Toolkit home</a>
    <a href="idea-generator.html">🎯 Idea generator →</a>
  </div>
  <div class="doc" id="doc"><div class="loading">Loading brief…</div></div>
</div>

<script>
// Minimal, dependency-free Markdown renderer — handles the subset used in IDEAS.md:
// headings, hr, blockquotes, ordered/unordered lists, bold/italic, inline code, links.
function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function inline(s) {
  // escape first, then apply inline formatting on the escaped text
  s = escapeHtml(s);
  s = s.replace(/`([^`]+)`/g, (_, c) => `<code>${c}</code>`);
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, t, u) =>
        `<a href="${u}" target="_blank" rel="noopener">${t}</a>`);
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/(^|[^*])\*([^*]+)\*(?!\*)/g, "$1<em>$2</em>");
  return s;
}
function render(md) {
  const lines = md.replace(/\r\n/g, "\n").split("\n");
  let html = "", i = 0;
  const flushList = (type, items) =>
    `<${type}>` + items.map(it => `<li>${inline(it)}</li>`).join("") + `</${type}>`;

  while (i < lines.length) {
    let line = lines[i];

    if (/^\s*$/.test(line)) { i++; continue; }
    if (/^---+\s*$/.test(line)) { html += "<hr>"; i++; continue; }

    // headings
    let h = line.match(/^(#{1,6})\s+(.*)$/);
    if (h) { const lvl = h[1].length; html += `<h${lvl}>${inline(h[2])}</h${lvl}>`; i++; continue; }

    // blockquote (collect consecutive >)
    if (/^>\s?/.test(line)) {
      const buf = [];
      while (i < lines.length && /^>\s?/.test(lines[i])) { buf.push(lines[i].replace(/^>\s?/, "")); i++; }
      html += `<blockquote>${inline(buf.join(" "))}</blockquote>`;
      continue;
    }

    // ordered list
    if (/^\s*\d+\.\s+/.test(line)) {
      const items = [];
      while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
        items.push(lines[i].replace(/^\s*\d+\.\s+/, "")); i++;
      }
      html += flushList("ol", items); continue;
    }

    // unordered list
    if (/^\s*[-*]\s+/.test(line)) {
      const items = [];
      while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) {
        items.push(lines[i].replace(/^\s*[-*]\s+/, "")); i++;
      }
      html += flushList("ul", items); continue;
    }

    // paragraph (gather until blank or block start)
    const para = [];
    while (i < lines.length && !/^\s*$/.test(lines[i]) &&
           !/^(#{1,6}\s|>\s?|---+\s*$|\s*[-*]\s+|\s*\d+\.\s+)/.test(lines[i])) {
      para.push(lines[i]); i++;
    }
    html += `<p>${inline(para.join(" "))}</p>`;
  }
  return html;
}

fetch("IDEAS.md")
  .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
  .then(md => { document.getElementById("doc").innerHTML = render(md); })
  .catch(e => {
    document.getElementById("doc").innerHTML =
      `<div class="loading err">Couldn't load IDEAS.md (${e.message}).<br>
       View it directly in the repo instead.</div>`;
  });
</script>
</body>
</html>
