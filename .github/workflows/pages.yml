name: Deploy TCG Toolkit to Pages

on:
  push:
    branches: [claude/tcg-business-ideas-hr75l8]
    paths:
      - 'tcg-business/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Allow this workflow to enable Pages and publish a deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        # enablement: true turns Pages on for the repo if it isn't already.
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: tcg-business

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
